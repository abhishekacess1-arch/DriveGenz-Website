name: add-fleet-images
on:
  push:
    paths:
      - '.github/workflows/add-fleet.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write images
        run: |
          mkdir -p img
          echo '' | base64 -d > img/sonet.jpg
          echo '' | base64 -d > img/virtus.jpg
          echo '' | base64 -d > img/thar.jpg
          echo '' | base64 -d > img/scorpion.jpg
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add img
          git commit -m "Add fleet photos"
          git push
