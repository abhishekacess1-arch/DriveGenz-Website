name: add-assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-assets.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write images
        run: |
          echo '' | base64 -d > favicon.png
          echo '' | base64 -d > og-cover.png
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add favicon.png og-cover.png
          git commit -m "Add favicon and social share image"
          git push
