name: update-og
on:
  push:
    paths:
      - '.github/workflows/update-og.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write image
        run: |
          echo '' | base64 -d > og-cover.png
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add og-cover.png
          git commit -m "Update social share image"
          git push
